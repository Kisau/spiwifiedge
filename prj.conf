# =================================================
# 基礎網路與 Wi-Fi 設定 (維持您的原設定)
# =================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_LOG=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI_ESWIFI=y
CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# =================================================
# Socket, POSIX 與 DNS 設定
# =================================================
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_SOCKETS_POLL_MAX=8
CONFIG_DNS_RESOLVER=y
CONFIG_MQTT_LIB=y

# 系統 Log 設定
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3


CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 【重要修改】將 Heap 從 2048 大幅提升到 32768。
# 因為連續發送 11 萬 Bytes 的資料時，底層 SPI 驅動與 eS-WiFi 模組溝通需要非常多動態記憶體。
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=1500
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768  

# =================================================
# 硬體卸載與 SPI 傳輸限制 (您的神兵利器)
# =================================================
CONFIG_NET_SOCKETS_OFFLOAD=y

# 這代表 STM32 每次透過 SPI 餵給 Wi-Fi 晶片的極限是 2048 Bytes。
CONFIG_WIFI_ESWIFI_MAX_DATA_SIZE=2048

CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_STM32=y

CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y