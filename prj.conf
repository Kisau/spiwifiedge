# =================================================
# 基礎網路與 Wi-Fi 設定 (維持您的原設定)
# =================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_LOG=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI_ESWIFI=y
CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_SOCKETS_POLL_MAX=8
CONFIG_DNS_RESOLVER=y
CONFIG_MQTT_LIB=y

# 系統 Log 設定
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3


CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=1500
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768  


CONFIG_NET_SOCKETS_OFFLOAD=y


CONFIG_WIFI_ESWIFI_MAX_DATA_SIZE=2048
CONFIG_DMA=y
CONFIG_UART_ASYNC_API=y
CONFIG_LOG=y
CONFIG_DMA_LOG_LEVEL_DBG=y
CONFIG_UART_LOG_LEVEL_DBG=y


CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_CONSOLE=y 
CONFIG_UART_CONSOLE=y   